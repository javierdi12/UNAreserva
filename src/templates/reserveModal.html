<!-- Modal reutilizable para reservar un espacio (se incluye en spaces.html y dashboard.html) -->
<div class="modal fade" id="reserveModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form method="post" id="reserveForm" novalidate>
                <div class="modal-header">
                    <div>
                        <h5 class="modal-title mb-0">Reservar espacio</h5>
                        <small class="text-danger fw-bold" id="reserveNombre"></small>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="hint mb-3">
                        <i class="bi bi-info-circle me-1"></i>
                        Horario del campus: 07:00 – 21:00. La reserva debe iniciar y terminar el mismo día.
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Inicio</label>
                        <input type="datetime-local" name="fecha_inicio" id="reserveInicio" class="form-control" step="900" required>
                    </div>
                    <div class="mb-1">
                        <label class="form-label">Fin</label>
                        <input type="datetime-local" name="fecha_fin" id="reserveFin" class="form-control" step="900" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-una"><i class="bi bi-check2-circle me-1"></i> Confirmar reserva</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    (function () {
        const modal = document.getElementById('reserveModal');
        const form = document.getElementById('reserveForm');
        const inicio = document.getElementById('reserveInicio');
        const fin = document.getElementById('reserveFin');
        const nombre = document.getElementById('reserveNombre');
        const actionBase = "{{ url_for('create_booking', id_recurso='__ID__') }}";

        function aLocalISO(d) {
            return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        }

        modal.addEventListener('show.bs.modal', function (e) {
            const btn = e.relatedTarget;
            form.dataset.recurso = btn.dataset.id;
            form.action = actionBase.replace('__ID__', btn.dataset.id);
            nombre.textContent = btn.dataset.nombre;
            inicio.min = fin.min = aLocalISO(new Date());
            inicio.value = fin.value = '';
            form.dataset.ok = '';
        });

        // Al elegir el inicio, sugiere un fin una hora despues
        inicio.addEventListener('change', function () {
            if (!inicio.value) return;
            fin.value = aLocalISO(new Date(new Date(inicio.value).getTime() + 60 * 60000));
        });

        // Validacion en cliente con SweetAlert2 (el servidor igual valida)
        form.addEventListener('submit', async function (e) {
            if (form.dataset.ok) return;
            e.preventDefault();

            const error = validar(inicio.value, fin.value);
            if (error) {
                Swal.fire({ icon: 'warning', title: 'Revisá el horario', text: error, confirmButtonText: 'Entendido' });
                return;
            }
            const ok = await confirmar({
                icon: 'question',
                title: '¿Confirmar reserva?',
                text: nombre.textContent + ' · ' + inicio.value.replace('T', ' ') + ' a ' + fin.value.slice(11),
                button: 'Sí, reservar'
            });
            if (ok) {
                form.dataset.ok = '1';
                const respuesta = await fetch("{{ url_for('reservar') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id_recurso: form.dataset.recurso,
                        fecha_inicio: inicio.value,
                        fecha_fin: fin.value
                    })
                });
                const datos = await respuesta.json().catch(() => ({}));
                if (respuesta.ok) {
                    const pendiente = respuesta.status === 202;
                    await Swal.fire({
                        icon: pendiente ? 'warning' : 'success',
                        title: pendiente ? 'Pendiente de sincronización' : 'Reserva confirmada',
                        text: pendiente
                            ? 'La reserva quedó guardada localmente y se sincronizará cuando vuelva la conexión.'
                            : 'La reserva se creó correctamente.',
                        confirmButtonText: 'Entendido'
                    });
                    window.location.href = "{{ url_for('my_bookings') }}";
                    return;
                }
                form.dataset.ok = '';
                const mensajes = {
                    409: ['Horario no disponible', 'Ya existe una reserva activa en ese horario.'],
                    423: ['Reserva en curso', 'Otro usuario está reservando ese recurso. Intentá de nuevo.'],
                    503: ['Servicios no disponibles', 'MongoDB o Redis no responde. Intentá de nuevo en unos momentos.']
                };
                const [titulo, texto] = mensajes[respuesta.status] || [
                    'No se pudo reservar',
                    datos.error || 'La solicitud no pudo completarse. Intentá de nuevo.'
                ];
                Swal.fire({ icon: 'error', title: titulo, text: texto, confirmButtonText: 'Entendido' });
            }
        });

        function validar(i, f) {
            if (!i || !f) return 'Completá la fecha de inicio y de fin.';
            const di = new Date(i), df = new Date(f);
            if (di >= df) return 'La hora de inicio debe ser anterior a la de fin.';
            if (di < new Date()) return 'No se puede reservar en el pasado.';
            if (i.slice(0, 10) !== f.slice(0, 10)) return 'La reserva debe iniciar y terminar el mismo día.';
            if (i.slice(11, 16) < '07:00' || f.slice(11, 16) > '21:00') return 'El horario del campus es de 07:00 a 21:00.';
            return null;
        }
    })();
</script>

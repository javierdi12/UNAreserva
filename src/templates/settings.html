{% extends "base.html" %}

{% block content %}
    <div class="page-header">
        <div>
            <h3>Configuración</h3>
            <p>Administrá tu perfil y preferencias de la cuenta.</p>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-3">
            <div class="card p-2">
                <a href="#" class="nav-item active"><i class="bi bi-person"></i> Perfil personal</a>
                <a href="#" class="nav-item" data-pronto="Notificaciones"><i class="bi bi-bell"></i> Notificaciones</a>
                <a href="#" class="nav-item" data-pronto="Seguridad"><i class="bi bi-shield-lock"></i> Seguridad</a>
            </div>
        </div>
        <div class="col-lg-9">
            <div class="card p-4">
                <h5 class="fw-bold mb-1">Perfil personal</h5>
                <p class="text-muted small mb-4">Esta información se muestra en tus reservas.</p>

                <form id="perfilForm">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="avatar" style="width: 64px; height: 64px; font-size: 1.2rem;">JD</div>
                        <div>
                            <div class="fw-bold">Juan Delgado</div>
                            <small class="text-muted">Estudiante</small>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" value="Juan Delgado" required>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label">Correo institucional</label>
                            <input type="email" class="form-control" value="juan.delgado@una.ac.cr" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-una"><i class="bi bi-check2 me-1"></i> Guardar cambios</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
<script>
    // Aun no hay backend para el perfil: se muestra el aviso con SweetAlert2.
    document.getElementById('perfilForm').addEventListener('submit', function (e) {
        e.preventDefault();
        Toast.fire({ icon: 'success', title: 'Cambios guardados' });
    });
    document.querySelectorAll('[data-pronto]').forEach(function (a) {
        a.addEventListener('click', function (e) {
            e.preventDefault();
            Swal.fire({ icon: 'info', title: a.dataset.pronto, text: 'Esta sección estará disponible próximamente.', confirmButtonText: 'Entendido' });
        });
    });
</script>
{% endblock %}

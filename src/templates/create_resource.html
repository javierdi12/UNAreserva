{% extends "base.html" %}

{% block content %}
    <div class="mb-4">
        <h3 class="fw-bold mb-1">{% if resource %}Editar recurso{% else %}Agregar nuevo recurso{% endif %}</h3>
        <p class="text-muted mb-0">
            {% if resource %}Modificá los datos de {{ resource.nombre }}.{% else %}Registrá un nuevo espacio reservable del campus.{% endif %}
        </p>
    </div>

    <div class="card border-0 shadow-sm p-4" style="max-width: 560px;">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Nombre del recurso</label>
                <input type="text" name="nombre" class="form-control" required
                       placeholder="Ej: Sala de Estudio 101"
                       value="{{ resource.nombre if resource else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Tipo de recurso</label>
                <select name="tipo" class="form-select">
                    {% set tipos = [('sala_estudio', 'Sala de Estudio'), ('laboratorio', 'Laboratorio'), ('cancha', 'Cancha Deportiva')] %}
                    {% for valor, etiqueta in tipos %}
                        <option value="{{ valor }}" {% if resource and resource.tipo == valor %}selected{% endif %}>{{ etiqueta }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Capacidad (personas)</label>
                <input type="number" name="capacidad" class="form-control" required min="1"
                       placeholder="Ej: 30"
                       value="{{ resource.capacidad if resource else '' }}">
            </div>

            <div class="mb-4">
                <label class="form-label">Ubicación</label>
                <input type="text" name="ubicacion" class="form-control" required
                       placeholder="Ej: Edificio A, Piso 2"
                       value="{{ resource.ubicacion if resource else '' }}">
            </div>

            <div class="d-flex gap-2">
                <a href="{{ url_for('spaces') }}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-una flex-fill">
                    {% if resource %}Guardar cambios{% else %}Guardar recurso{% endif %}
                </button>
            </div>
        </form>
    </div>
{% endblock %}

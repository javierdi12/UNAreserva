{% extends "base.html" %}

{% block head %}
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">
{% endblock %}

{% block content %}
    <div class="page-header">
        <div>
            <h3>Calendario</h3>
            <p>Revisá tus reservas y la disponibilidad del campus.</p>
        </div>
        <a href="{{ url_for('spaces') }}" class="btn btn-una"><i class="bi bi-plus-lg me-1"></i> Nueva reserva</a>
    </div>

    <div class="d-flex gap-3 mb-3 small text-muted">
        <span><i class="bi bi-circle-fill text-danger me-1" style="font-size: .6rem;"></i>Confirmada</span>
        <span><i class="bi bi-circle-fill me-1" style="font-size: .6rem; color: #9e9e9e;"></i>Cancelada</span>
    </div>

    <div class="card p-4">
        <div id="calendar"></div>
    </div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales-all.global.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth',
            locale: 'es',
            height: 'auto',
            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
            buttonText: { today: 'Hoy', month: 'Mes', week: 'Semana' },
            slotMinTime: '07:00:00',
            slotMaxTime: '21:00:00',
            events: '/api/bookings',
            eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
            eventClick: function (info) {
                const opts = { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' };
                const ini = info.event.start.toLocaleString('es-CR', opts);
                const fin = info.event.end ? info.event.end.toLocaleTimeString('es-CR', { hour: '2-digit', minute: '2-digit' }) : '';
                Swal.fire({
                    icon: 'info',
                    title: info.event.title,
                    html: '<b>Inicio:</b> ' + ini + (fin ? '<br><b>Fin:</b> ' + fin : ''),
                    confirmButtonText: 'Cerrar'
                });
            }
        });
        calendar.render();
    });
</script>
{% endblock %}

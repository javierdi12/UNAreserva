<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UNAreserva - Autenticación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; background: #f5f6f8; }
        .auth-card { width: min(100% - 2rem, 440px); border: 0; border-radius: 18px; box-shadow: 0 18px 45px rgba(22, 26, 34, .12); }
        .auth-logo { color: var(--una-red); font-weight: 800; font-size: 1.5rem; }
    </style>
</head>
<body>
    <main class="card auth-card p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="auth-logo">UNAreserva</div>
            <small class="text-muted">Universidad Nacional</small>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'danger' else category }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block auth_content %}{% endblock %}
    </main>
</body>
</html>

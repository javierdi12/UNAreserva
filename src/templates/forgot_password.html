{% extends "auth_base.html" %}
{% block auth_content %}
<h2 class="h4 fw-bold mb-1">Recuperar contraseña</h2>
<p class="text-muted mb-4">Ingresá tu correo y te enviaremos un enlace si existe una cuenta.</p>
<form method="post">
    <div class="mb-3"><label class="form-label">Correo</label><input type="email" name="correo" class="form-control" required autofocus></div>
    <button class="btn btn-una w-100" type="submit">Enviar enlace</button>
</form>
<p class="text-center mt-4 mb-0 small"><a href="{{ url_for('login') }}">Volver al inicio de sesión</a></p>
{% endblock %}

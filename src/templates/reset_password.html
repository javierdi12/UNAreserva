{% extends "auth_base.html" %}
{% block auth_content %}
<h2 class="h4 fw-bold mb-1">Nueva contraseña</h2>
<p class="text-muted mb-4">Elegí una contraseña nueva para tu cuenta.</p>
<form method="post">
    <div class="mb-3"><label class="form-label">Nueva contraseña</label><input type="password" name="password" class="form-control" minlength="8" required autofocus></div>
    <div class="mb-4"><label class="form-label">Confirmar contraseña</label><input type="password" name="password_confirm" class="form-control" minlength="8" required></div>
    <button class="btn btn-una w-100" type="submit">Guardar contraseña</button>
</form>
{% endblock %}

{% extends "auth_base.html" %}
{% block auth_content %}
<h2 class="h4 fw-bold mb-1">Iniciar sesión</h2>
<p class="text-muted mb-4">Accedé para reservar espacios del campus.</p>
<form method="post">
    <div class="mb-3"><label class="form-label">Correo</label><input type="email" name="correo" class="form-control" required autofocus></div>
    <div class="mb-3"><label class="form-label">Contraseña</label><input type="password" name="password" class="form-control" required></div>
    <button class="btn btn-una w-100" type="submit">Ingresar</button>
</form>
<div class="d-flex justify-content-between mt-4 small">
    <a href="{{ url_for('register') }}">Crear cuenta estudiantil</a>
    <a href="{{ url_for('forgot_password') }}">¿Olvidaste tu contraseña?</a>
</div>
{% endblock %}
